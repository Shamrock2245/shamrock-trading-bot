# ─────────────────────────────────────────────────────────────────────────────
# Shamrock Trading Bot — CI/CD Pipeline
# Jobs:
#   1. lint-and-test  → pytest + import validation
#   2. preflight      → smoke test: python main.py --scan
#   3. deploy         → SSH into Hetzner, git pull, docker rebuild (main only)
#
# Required GitHub Secrets for deploy:
#   HETZNER_HOST      → Server IP or hostname
#   HETZNER_USER      → SSH username (e.g., shamrock)
#   HETZNER_SSH_KEY   → Private SSH key for deployment
# ─────────────────────────────────────────────────────────────────────────────

name: CI/CD

on:
  pull_request:
  push:
    branches: ["main", "master", "work"]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Lint + Unit Tests ──────────────────────────────────────────────
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q --tb=short

  # ── Job 2: Preflight Smoke Test ───────────────────────────────────────────
  preflight:
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preflight — import check
        run: python -c "from main import main; print('✅ Import OK')"

  # ── Job 3: Deploy to Hetzner (main branch only) ──────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: preflight
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 15
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            # ── Pre-deploy: disk space check + auto-prune ─────────────────
            DISK_FREE_KB=$(df / | awk 'NR==2 {print $4}')
            DISK_FREE_GB=$(echo "scale=1; $DISK_FREE_KB / 1048576" | bc)
            echo "💾 Disk free before deploy: ${DISK_FREE_GB}GB"
            if [ "$DISK_FREE_KB" -lt 3145728 ]; then
              echo "⚠️  Low disk (<3GB free) — pruning Docker build cache and dangling images..."
              docker builder prune -af 2>/dev/null || true
              docker image prune -af 2>/dev/null || true
              docker container prune -f 2>/dev/null || true
              DISK_FREE_AFTER=$(df / | awk 'NR==2 {print $4}')
              echo "💾 Disk free after prune: $(echo "scale=1; $DISK_FREE_AFTER / 1048576" | bc)GB"
              if [ "$DISK_FREE_AFTER" -lt 1048576 ]; then
                echo "❌ FATAL: Less than 1GB free after prune — aborting deploy to protect VPS stability"
                exit 1
              fi
            fi
            # ── Deploy ────────────────────────────────────────────────────
            cd ~/shamrock-trading-bot
            git pull origin main
            export GIT_SHA=$(git rev-parse --short HEAD)
            docker compose down
            docker builder prune -f 2>/dev/null || true
            docker compose build --no-cache
            docker compose up -d
            echo "✅ Deployed shamrock-bot @ $GIT_SHA"
            # ── Post-deploy: report disk and container status ─────────────
            echo "💾 Post-deploy disk: $(df -h / | awk 'NR==2 {print $3"/"$2" used ("$5" full)"}')"
            echo "🐳 Running containers:"
            docker ps --format "  {{.Names}}: {{.Status}}"
