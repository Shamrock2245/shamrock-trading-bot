# ─────────────────────────────────────────────────────────────────────────────
# Shamrock Trading Bot — Docker Compose
# Usage:
#   docker-compose up -d           → Start all services
#   docker-compose logs -f bot     → Tail bot logs
#   docker-compose down            → Stop all services
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Main Trading Bot ─────────────────────────────────────────────────────
  bot:
    build:
      context: .
      target: runtime
    container_name: shamrock-bot
    restart: unless-stopped
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 8.8.4.4
    environment:
      # Align bot_status.json write path with health check and dashboard readers
      - DASHBOARD_STATE_DIR=/app/data/dashboard
      - BOT_STATUS_FILE=/app/data/dashboard/bot_status.json
      # Sentry error tracking (set SENTRY_DSN in .env)
      - SENTRY_DSN=${SENTRY_DSN:-}
      - GIT_SHA=${GIT_SHA:-dev}
      # Paper mode is the safe default — override in .env with MODE=live only after campaign
      - MODE=${MODE:-paper}
      # Lock paper for multi-week tuning (set PAPER_MODE_LOCKED=false to allow auto-promote)
      - PAPER_MODE_LOCKED=${PAPER_MODE_LOCKED:-true}
      - PAPER_TUNING_CAMPAIGN_ENABLED=${PAPER_TUNING_CAMPAIGN_ENABLED:-true}
      - PAPER_TUNING_CAMPAIGN_DAYS=${PAPER_TUNING_CAMPAIGN_DAYS:-21}
    ports:
      - "8787:8787"    # Moralis Streams webhook ingestion
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./output:/app/output
    depends_on:
      - db
    networks:
      - shamrock-net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── Paper Trading Mode (safe default) ────────────────────────────────────
  paper-trader:
    build:
      context: .
      target: runtime
    container_name: shamrock-paper
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MODE=paper
      - PAPER_MODE_LOCKED=true
      - PAPER_TUNING_CAMPAIGN_ENABLED=true
    command: python3 scripts/paper_trade.py
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      - db
    networks:
      - shamrock-net
    profiles:
      - paper

  # ── SQLite Database (volume-backed) ──────────────────────────────────────
  db:
    image: alpine:3.18
    container_name: shamrock-db
    volumes:
      - db-data:/data
    command: sh -c "mkdir -p /data && tail -f /dev/null"
    networks:
      - shamrock-net

  # ── Streamlit Dashboard ───────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      target: runtime
    container_name: shamrock-dashboard
    restart: unless-stopped
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 8.8.4.4
    environment:
      - DASHBOARD_STATE_DIR=/app/data/dashboard
    working_dir: /app/web
    command: reflex run --env prod
    ports:
      - "8000:8000"
      - "3000:3000"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./output:/app/output
    depends_on:
      - bot
    networks:
      - shamrock-net

  # ── Health Check Cron ─────────────────────────────────────────────────────
  health:
    build:
      context: .
      target: runtime
    container_name: shamrock-health
    restart: unless-stopped
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 8.8.4.4
    environment:
      # bot_status.json is written by dashboard/state.py to data/dashboard/
      # health_check.py defaults to output/ — align them here
      - BOT_STATUS_FILE=/app/data/dashboard/bot_status.json
    command: python3 scripts/health_check.py
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./output:/app/output
    networks:
      - shamrock-net

  # ── ML Auto-Tuner Service ──────────────────────────────────────────────────
  # Always runs against paper-journaled trades during the tuning campaign.
  auto-tuner:
    build:
      context: .
      target: runtime
    container_name: shamrock-auto-tuner
    restart: unless-stopped
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 8.8.4.4
    environment:
      - MODE=${MODE:-paper}
      - PAPER_MODE_LOCKED=${PAPER_MODE_LOCKED:-true}
      - PAPER_TUNING_CAMPAIGN_ENABLED=${PAPER_TUNING_CAMPAIGN_ENABLED:-true}
      - OPTUNA_ENABLED=${OPTUNA_ENABLED:-true}
      - ML_WEIGHT_OPTIMIZER_ENABLED=${ML_WEIGHT_OPTIMIZER_ENABLED:-true}
    command: python3 scripts/auto_tuner_service.py
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./output:/app/output
    depends_on:
      - db
    networks:
      - shamrock-net

  # ── Candle Recorder (offline research data, no keys) ──────────────────────
  # Hyperliquid only serves the latest 5000 bars per interval, so we keep our
  # own 1h/15m candles + funding/OI snapshots in data/candles/ for the
  # backtest/ walk-forward. Public info endpoint only: deliberately NO env_file
  # (no secrets, no trading config) and it imports nothing from core/.
  candle-recorder:
    build:
      context: .
      target: runtime
    container_name: shamrock-candle-recorder
    restart: unless-stopped
    command: python3 -m backtest.candle_recorder --loop --every-min 60
    environment:
      - CANDLE_RECORDER_DIR=/app/data/candles
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,sys,time; p='/app/data/candles/.recorder_heartbeat'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 10800 else 1)"]
      interval: 300s
      timeout: 15s
      start_period: 900s
      retries: 3
    networks:
      - shamrock-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db-data:
    driver: local

networks:
  shamrock-net:
    driver: bridge
