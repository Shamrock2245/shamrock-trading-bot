[theme]
primaryColor = "#00D09C"
backgroundColor = "#0A0E14"
secondaryBackgroundColor = "#131920"
textColor = "#E6EDF3"
font = "sans serif"

[server]
headless = true
# SECURITY: Bind to localhost by default. To expose externally, set DASHBOARD_BIND_ADDRESS=0.0.0.0
# For remote access, use an SSH tunnel: ssh -L 8501:localhost:8501 user@server
address = "127.0.0.1"
port = 8501
enableCORS = false
enableXsrfProtection = false
# Faster file watcher for Docker volumes
fileWatcherType = "poll"

[browser]
gatherUsageStats = false

[runner]
magicEnabled = false
# Faster reruns — skip full module reload when possible
fastReruns = true
