# ─────────────────────────────────────────────────────────────────────────────
# Postiz service block for docker-compose.yml
# Add this under `services:` in your existing docker-compose.yml
# OR merge it into an existing postiz service block
#
# Key change: MAIN_URL, FRONTEND_URL, NEXT_PUBLIC_BACKEND_URL now use HTTPS
# This resolves: crypto.randomUUID is not a function (insecure context error)
# ─────────────────────────────────────────────────────────────────────────────

services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: postiz
    restart: unless-stopped
    profiles:
      - social
    ports:
      - "5200:5000"    # Host 5200 → Container 5000 (Nginx proxies 443 → 5200)
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    environment:
      # ── URL Configuration (HTTPS required for Web Crypto API) ──────────────
      # These MUST match your public domain exactly — no trailing slash
      MAIN_URL: 'https://social.shamrockbailbonds.biz'
      FRONTEND_URL: 'https://social.shamrockbailbonds.biz'
      NEXT_PUBLIC_BACKEND_URL: 'https://social.shamrockbailbonds.biz/api'
      BACKEND_INTERNAL_URL: 'http://localhost:3000'

      # ── Required: set in .env or override here ────────────────────────────
      JWT_SECRET: '${POSTIZ_JWT_SECRET}'
      DATABASE_URL: 'postgresql://postiz-user:${POSTIZ_DB_PASSWORD}@postiz-postgres:5432/postiz-db-local'
      REDIS_URL: 'redis://postiz-redis:6379'

      # ── Optional: Temporal workflow engine ───────────────────────────────
      # TEMPORAL_ADDRESS: "temporal:7233"

      # ── Storage: local filesystem ─────────────────────────────────────────
      STORAGE_PROVIDER: 'local'
      UPLOAD_DIRECTORY: '/uploads'
      NEXT_PUBLIC_UPLOAD_DIRECTORY: '/uploads'

      IS_GENERAL: 'true'
      DISABLE_REGISTRATION: 'false'

    networks:
      - shamrock-net
    depends_on:
      - postiz-postgres
      - postiz-redis

  postiz-postgres:
    image: postgres:16-alpine
    container_name: postiz-postgres
    restart: unless-stopped
    profiles:
      - social
    environment:
      POSTGRES_USER: postiz-user
      POSTGRES_PASSWORD: '${POSTIZ_DB_PASSWORD}'
      POSTGRES_DB: postiz-db-local
    volumes:
      - postiz-postgres-data:/var/lib/postgresql/data
    networks:
      - shamrock-net

  postiz-redis:
    image: redis:7-alpine
    container_name: postiz-redis
    restart: unless-stopped
    profiles:
      - social
    volumes:
      - postiz-redis-data:/data
    networks:
      - shamrock-net

# ── Add these to your existing volumes: block ─────────────────────────────────
# volumes:
#   postiz-config:
#   postiz-uploads:
#   postiz-postgres-data:
#   postiz-redis-data:
